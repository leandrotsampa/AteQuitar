<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Até Quitar</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <meta name="description" content="Acompanhe seu financiamento imobiliário até a quitação." />
    <script>
      // Tema antes do primeiro desenho: sem piscar claro ao abrir no escuro. No app vem do banco (lido
      // pela ponte do Electron); no navegador, do localStorage. O nome antigo vale até a migração
      try {
        var api = window.electronAPI;
        var theme = (api && api.prefs && api.prefs.theme) || localStorage.getItem('atequitar_pref:theme') || localStorage.getItem('atequitar_theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
